<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Marksheet</title>
    <style>
      :root {
        --bg: #1c2230;
        --panel: #2a3142;
        --panel-2: #232938;
        --border: #3a4356;
        --frame: #8a9bb0;
        --text: #c8d1e0;
        --muted: #7d8ba0;
        --accent: #7eb8c4;
        --accent-hi: #a8d4dc;
        --ok: #6cd49a;
        --err: #e07878;
        --dup: #7eb8c4;
      }
      * { box-sizing: border-box; }
      html, body {
        background: var(--bg);
        color: var(--text);
        font-family: "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        margin: 0;
        padding: 12px;
        height: 100vh;
        overflow-y: auto;
      }
      h1 {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent-hi);
        border: 1px solid var(--frame);
        background: var(--panel-2);
        padding: 5px 9px;
        margin: 0 0 10px;
        display: inline-block;
      }
      .panel {
        border: 1px solid var(--border);
        background: var(--panel);
        padding: 10px;
        margin-bottom: 10px;
      }
      label {
        display: block;
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.10em;
        margin-top: 10px;
        margin-bottom: 4px;
      }
      label:first-child { margin-top: 0; }
      select, input, button {
        width: 100%;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 6px 8px;
        font: inherit;
        outline: none;
      }
      select:focus, input:focus { border-color: var(--accent); }
      .btn-row { display: flex; gap: 6px; margin-top: 6px; }
      .btn-row button { flex: 1; }
      button.primary {
        background: var(--accent);
        color: var(--bg);
        border: none;
        padding: 9px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button.primary:hover { background: var(--accent-hi); }
      button.danger {
        background: var(--err);
        color: var(--bg);
        border: none;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
      }
      button.ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        cursor: pointer;
        font-size: 11px;
      }
      button.ghost:hover { color: var(--text); border-color: var(--frame); }
      .row {
        display: grid;
        grid-template-columns: 60px 1fr;
        gap: 8px;
        align-items: center;
        margin-top: 6px;
      }
      .row label {
        margin: 0;
        text-transform: lowercase;
        letter-spacing: 0;
        font-size: 12px;
        color: var(--text);
      }
      .hint { color: var(--muted); font-size: 10px; margin-top: 4px; word-break: break-word; }
      #status { text-align: center; font-size: 11px; min-height: 14px; margin: 8px 0; }
      .ok  { color: var(--ok); }
      .err { color: var(--err); }
      .dup { color: var(--dup); }
      #tabInfo { font-size: 10px; color: var(--muted); word-break: break-all; }
    </style>
  </head>
  <body>
    <div class="panel">
      <label>active configuration</label>
      <select id="configSel"></select>
      <div class="btn-row">
        <button id="newConfig" class="primary">New</button>
        <button id="deleteConfig" class="danger">Delete</button>
      </div>
    </div>

    <button id="saveBtn" class="primary">Save current page</button>
    <div id="status"></div>

    <div class="panel">
      <label for="cfgName">config name</label>
      <input id="cfgName" type="text" placeholder="e.g. work, reading…" />

      <label for="sheetInput">spreadsheet url or id</label>
      <input id="sheetInput" type="text" placeholder="https://docs.google.com/spreadsheets/d/…" />
      <div class="hint" id="sheetInfo">—</div>

      <label for="tab">tab</label>
      <select id="tab"><option>—</option></select>

      <label for="addType">addition type</label>
      <select id="addType">
        <option value="append">append</option>
      </select>
    </div>

    <div class="panel">
      <label>column mapping</label>
      <div class="hint">(none) = skip</div>
      <div class="row"><label for="mapUrl">url</label><select id="mapUrl"></select></div>
      <div class="row"><label for="mapTitle">title</label><select id="mapTitle"></select></div>
      <div class="row"><label for="mapDate">date</label><select id="mapDate"></select></div>
    </div>

    <button id="save" class="primary">Save settings</button>

    <div class="panel" style="margin-top: 10px;">
      <label>local url cache</label>
      <div class="hint" id="cacheInfo">—</div>
      <button id="refresh" class="ghost" style="margin-top: 6px;">Refresh now</button>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
