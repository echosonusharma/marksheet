name: Release Extension

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json'));
            m.version = process.env.VERSION.replace(/^v/, '');
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2));
          "
        env:
          VERSION: ${{ github.ref_name }}

      - name: Build extension zip
        run: bash build.sh --strip-key

      - name: Get zip name
        id: zip
        run: echo "file=$(ls *.zip)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.file }}
          generate_release_notes: true
